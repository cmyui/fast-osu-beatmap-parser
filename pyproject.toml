[build-system]
requires = ["scikit-build-core>=0.10"]
build-backend = "scikit_build_core.build"

[project]
name = "fosu"
version = "0.2.0"
description = "Fast native osu! beatmap parsing with owned Python results"
readme = "docs/python.md"
requires-python = ">=3.10"
dependencies = ["typing-extensions>=4.6; python_version < '3.12'"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: C++",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
]

[project.optional-dependencies]
test = ["pytest>=8", "mypy==2.3.1"]

[tool.mypy]
python_version = "3.10"
files = ["python/fosu", "tests/typing"]
strict = true
warn_unreachable = true
disallow_any_unimported = true
enable_error_code = [
  "truthy-bool",
  "truthy-iterable",
  "ignore-without-code",
  "unused-awaitable",
  "redundant-expr",
  "possibly-undefined",
  "mutable-override",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[project.urls]
Repository = "https://github.com/cmyui/fast-osu-beatmap-parser"

[tool.scikit-build]
cmake.version = ">=3.26"
ninja.make-fallback = true
wheel.packages = ["python/fosu"]
wheel.py-api = "cp310"
sdist.exclude = ["build", "dist", "tests/reference/official/bin", "tests/reference/official/obj", "bench/comparison/results"]

[tool.cibuildwheel]
build = "cp310-*"
skip = "*-manylinux_i686"
test-requires = ["pytest>=8", "mypy==2.3.1"]
test-command = "python -m pytest {project}/tests/test_python.py && FOSU_BACKEND=scalar python -m pytest {project}/tests/test_python.py && python {project}/tests/test_binary_hardening.py"

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"

[tool.cibuildwheel.macos]
environment = { MACOSX_DEPLOYMENT_TARGET = "11.0" }

[tool.cibuildwheel.windows]
archs = ["AMD64"]
test-command = "python -m pytest {project}/tests/test_python.py && set FOSU_BACKEND=scalar&& python -m pytest {project}/tests/test_python.py && python {project}/tests/test_binary_hardening.py"
