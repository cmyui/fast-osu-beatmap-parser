[build-system]
requires = ["scikit-build-core>=0.10"]
build-backend = "scikit_build_core.build"

[project]
name = "fosu"
version = "0.2.0"
description = "Fast native osu! beatmap parsing with owned Python results"
readme = "docs/python.md"
requires-python = ">=3.10"
dependencies = ["typing-extensions>=4.6; python_version < '3.12'"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: C++",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
]

[project.optional-dependencies]
test = ["pytest>=8", "mypy>=1.11"]

[project.urls]
Repository = "https://github.com/cmyui/fast-osu-beatmap-parser"

[tool.scikit-build]
cmake.version = ">=3.26"
wheel.packages = ["python/fosu"]
wheel.py-api = "cp310"
sdist.exclude = ["build", "dist", "tests/reference/official/bin", "tests/reference/official/obj", "bench/comparison/results"]

[tool.cibuildwheel]
build = "cp310-*"
skip = "*-musllinux* *-win* *-manylinux_i686 *-macosx_x86_64"
test-requires = ["pytest>=8", "mypy>=1.11"]
test-command = "python -m pytest {project}/tests/test_python.py && FOSU_FORCE_SCALAR=1 python -m pytest {project}/tests/test_python.py && python {project}/tests/test_binary_hardening.py"

[tool.cibuildwheel.linux]
archs = ["x86_64"]
manylinux-x86_64-image = "manylinux_2_28"

[tool.cibuildwheel.macos]
archs = ["arm64"]
environment = { MACOSX_DEPLOYMENT_TARGET = "11.0" }
