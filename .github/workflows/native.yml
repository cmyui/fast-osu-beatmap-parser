name: Native parser checks

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: python3 tests/test_build.py
      - run: make -j2 CXX=g++ test
      - run: make -j2 CXX=g++ ISA=scalar test
      - run: make -j2 CXX=g++ PROFILE=portable test-parser
      - run: make -j2 CXX=g++ PROFILE=debug test-parser
      - run: make -j2 CXX=clang++ PROFILE=sanitize test
      - run: make CXX=clang++ PROFILE=sanitize fuzz-smoke
      - name: Check complete one-shot output and resource limits
        run: make -j2 CXX=g++ ONESHOT_FLAGS=-march=x86-64-v3 test-oneshot
      - name: Build and exercise benchmark tools
        run: |
          make -j2 CXX=g++ bench-build references build/release-avx2-bundled/oneshot_process
          build/release-avx2-bundled/generate_corpus build/smoke-corpus
          make CXX=g++ CORPUS=build/smoke-corpus REPS=2 bench
          build/release-avx2-bundled/validate_corpus build/smoke-corpus build/release-avx2-bundled/numeric_oracle.so
          python3 bench/library_first_compare.py build/smoke-corpus build/release-avx2-bundled/library_first build/release-avx2-bundled/c_api_first --limit 2 --reps 1 > build/first.csv
          python3 bench/summarize.py build/first.csv

  native-macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: make -j3 test bench-build references
      - run: make -j3 PROFILE=sanitize test

  official-acceptance:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install build
      - run: python -m build --sdist --outdir dist
      - run: python -m pip install dist/*.tar.gz
      - run: sh tests/reference/official/build.sh
      - run: python tests/test_official.py
      - run: FOSU_FORCE_SCALAR=1 python tests/test_official.py
