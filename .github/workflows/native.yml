name: Native parser checks

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: make CXX=g++ test test-c-api
      - run: make CXX=clang++ test-sanitize fuzz-smoke

  official-acceptance:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - run: sh bench/official-reference/build.sh
      - run: python tests/test_official.py
      - run: FOSU_FORCE_SCALAR=1 python tests/test_official.py
