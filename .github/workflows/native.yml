name: Native parser checks

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: make CXX=g++ test test-c-api
      - name: Compile and check the optional AVX-512 prefix
        run: |
          g++ -std=c++20 -O3 -Iinclude -march=x86-64-v3 -mavx512vl -mavx512vbmi tests/test_parser.cpp -o build/test_avx512
          g++ -x c++ -o build/has_avx512 - <<'CPP'
          int main() {
              return !(__builtin_cpu_supports("avx512f") &&
                       __builtin_cpu_supports("avx512bw") &&
                       __builtin_cpu_supports("avx512vl") &&
                       __builtin_cpu_supports("avx512vbmi"));
          }
          CPP
          if build/has_avx512; then build/test_avx512; else echo 'AVX-512 execution skipped on this CPU'; fi
      - run: make CXX=clang++ test-sanitize fuzz-smoke

  official-acceptance:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - run: sh bench/official-reference/build.sh
      - run: python tests/test_official.py
      - run: FOSU_FORCE_SCALAR=1 python tests/test_official.py
