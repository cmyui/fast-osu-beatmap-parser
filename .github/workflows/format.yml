name: Code quality

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install pre-commit==4.6.0
      - name: Check formatting and Python types
        run: pre-commit run --all-files --show-diff-on-failure

  clangd:
    name: clangd / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-26, macos-26-intel, windows-2025]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install clangd 23
        if: runner.os == 'Linux'
        run: |
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | gpg --dearmor | sudo tee /etc/apt/keyrings/llvm.gpg > /dev/null
          echo 'deb [signed-by=/etc/apt/keyrings/llvm.gpg] https://apt.llvm.org/noble/ llvm-toolchain-noble-23 main' | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update -qq
          sudo apt-get install -y clang-23 clangd-23
          clangd-23 --version
      - name: Install clangd 23 on macOS
        if: runner.os == 'macOS'
        run: |
          brew install llvm
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
      - name: Install clangd 22 on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/clangd/clangd/releases/download/22.1.6/clangd-windows-22.1.6.zip -OutFile clangd.zip
          Expand-Archive clangd.zip -DestinationPath build/clangd-tool
          (Resolve-Path build/clangd-tool/clangd_22.1.6/bin).Path | Out-File -FilePath $env:GITHUB_PATH -Append
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Configure compile commands on Linux
        if: runner.os == 'Linux'
        run: cmake -S . -B build/clangd -G Ninja -DFOSU_BUILD_PYTHON=ON -DCMAKE_C_COMPILER=clang-23 -DCMAKE_CXX_COMPILER=clang++-23
      - name: Configure compile commands on macOS
        if: runner.os == 'macOS'
        run: cmake -S . -B build/clangd -G Ninja -DFOSU_BUILD_PYTHON=ON
      - name: Configure compile commands on Windows
        if: runner.os == 'Windows'
        run: cmake -S . -B build/clangd -G Ninja -DFOSU_BUILD_PYTHON=ON -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl
      - name: Check clangd diagnostics on Linux
        if: runner.os == 'Linux'
        run: python scripts/check_clangd.py --clangd clangd-23 --compile-commands build/clangd
      - name: Check clangd diagnostics
        if: runner.os != 'Linux'
        run: python scripts/check_clangd.py --compile-commands build/clangd
