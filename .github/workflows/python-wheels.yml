name: Python wheels

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheels:
    name: Wheel / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pypa/cibuildwheel@v4.2.1
      - uses: actions/upload-artifact@v4
        with:
          name: fosu-wheel-${{ matrix.os }}
          path: wheelhouse/*.whl

  installed:
    name: Installed / ${{ matrix.os }} / Python ${{ matrix.python }}
    needs: wheels
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: fosu-wheel-${{ matrix.os }}
          path: wheelhouse
      - run: python -m pip install wheelhouse/*.whl pytest numpy
      - run: python -m pytest tests/test_python.py
      - run: FOSU_FORCE_SCALAR=1 python -m pytest tests/test_python.py
