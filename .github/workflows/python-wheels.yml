name: Python wheels

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-metadata:
    runs-on: ubuntu-24.04
    outputs:
      publish: ${{ steps.release.outputs.publish }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate version and select release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import subprocess
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          match = re.search(
              r"project\(fosu VERSION ([0-9]+\.[0-9]+\.[0-9]+) LANGUAGES",
              Path("CMakeLists.txt").read_text(),
          )
          if not match or match.group(1) != version:
              raise SystemExit("pyproject.toml and CMakeLists.txt versions differ")
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", version):
              raise SystemExit(f"unsupported release version: {version}")

          current = tuple(map(int, version.split(".")))
          tag = f"v{version}"
          tags = subprocess.check_output(
              ["git", "tag", "--list", "v[0-9]*.[0-9]*.[0-9]*"], text=True
          ).splitlines()
          releases = [
              tuple(map(int, value[1:].split(".")))
              for value in tags
              if re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", value)
          ]
          latest = max(releases, default=(0, 0, 0))
          tag_exists = tag in tags
          if current < latest or (current == latest and not tag_exists):
              raise SystemExit(f"version {version} is not newer than the latest tag")

          release = subprocess.run(
              ["gh", "release", "view", tag, "--json", "isDraft"],
              text=True,
              capture_output=True,
          )
          release_state = json.loads(release.stdout) if release.returncode == 0 else None
          publish = (
              os.environ["GITHUB_EVENT_NAME"] == "push"
              and os.environ["GITHUB_REF"] == "refs/heads/master"
              and (not tag_exists or release_state is None or release_state["isDraft"])
          )
          if tag_exists and publish:
              tagged_commit = subprocess.check_output(
                  ["git", "rev-list", "-n", "1", tag], text=True
              ).strip()
              if tagged_commit != os.environ["GITHUB_SHA"]:
                  raise SystemExit(f"unfinished {tag} release belongs to another commit")

          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"publish={str(publish).lower()}", file=output)
              print(f"tag={tag}", file=output)
          PY

  wheels:
    name: Wheel / ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x86_64
          - runner: ubuntu-24.04-arm
            platform: linux-aarch64
          - runner: macos-26
            platform: macos-arm64
          - runner: macos-26-intel
            platform: macos-x86_64
          - runner: windows-2025
            platform: windows-x86_64
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pypa/cibuildwheel@v4.2.1
        env:
          CIBW_ARCHS: native
          CIBW_BEFORE_ALL_LINUX: sh {project}/.github/scripts/install-gcc-15.sh
          CIBW_ENVIRONMENT_LINUX: CC=/usr/local/bin/gcc CXX=/usr/local/bin/g++
      - uses: actions/upload-artifact@v4
        with:
          name: fosu-wheel-${{ matrix.platform }}
          path: wheelhouse/*.whl

  installed:
    name: Installed / ${{ matrix.platform }} / Python ${{ matrix.python }}
    needs: wheels
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x86_64
            python: '3.14'
          - runner: ubuntu-24.04-arm
            platform: linux-aarch64
            python: '3.14'
          - runner: macos-26
            platform: macos-arm64
            python: '3.14'
          - runner: macos-26-intel
            platform: macos-x86_64
            python: '3.14'
          - runner: windows-2025
            platform: windows-x86_64
            python: '3.14'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: fosu-wheel-${{ matrix.platform }}
          path: wheelhouse
      - run: python -m pip install pytest mypy==2.3.1
      - run: python -m pip install --no-index --find-links wheelhouse fosu
      - run: python -m pytest tests/test_python.py
      - run: python -m pytest tests/test_python.py
        env:
          FOSU_BACKEND: scalar
      - run: python tests/test_binary_hardening.py

  source-install:
    name: Source install / Unix Makefiles
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: CMAKE_GENERATOR="Unix Makefiles" python -m pip install '.[test]'
      - run: python -m pytest tests/test_python.py

  sdist:
    name: Source distribution
    if: needs.release-metadata.outputs.publish == 'true'
    needs: release-metadata
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: python -m pip install build
      - run: python -m build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: fosu-sdist
          path: dist/*.tar.gz

  publish:
    name: Publish release artifacts
    if: needs.release-metadata.outputs.publish == 'true'
    needs: [release-metadata, wheels, installed, source-install, sdist]
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/fosu
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: fosu-*
          path: dist
          merge-multiple: true
      - name: Create draft release and upload artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-metadata.outputs.tag }}
        run: |
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --draft --generate-notes \
              --target "$GITHUB_SHA" --title "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY"
          fi
          gh release upload "$RELEASE_TAG" dist/* --clobber \
            --repo "$GITHUB_REPOSITORY"
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-metadata.outputs.tag }}
        run: gh release edit "$RELEASE_TAG" --draft=false --latest --repo "$GITHUB_REPOSITORY"
